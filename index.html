<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>totennacht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================
   RESET & BASE
========================= */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    width: 100%; min-height: 100vh; background-color: #000; color: #ffffff;
    font-family: 'Inter', sans-serif; display: flex; justify-content: center;
    padding: 24px 16px; overflow-x: hidden;
}

/* =========================
   FULLSCREEN VIDEO BACKGROUND
========================= */
.bg-video {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    z-index: -2; object-fit: cover; pointer-events: none; filter: none !important;
}
.bg-overlay { position: fixed; inset: 0; z-index: -1; background: rgba(0,0,0,0.55); }

/* =========================
   SOUND BUTTON (CLICK HERE)
========================= */
.sound-btn {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: rgba(15, 20, 30, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #ffffff;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 600;
    cursor: pointer;
    z-index: 1000;
    display: none;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 5px;
    transition: background 0.2s, transform 0.2s;
    backdrop-filter: blur(5px);
}

.sound-btn:hover {
    background: rgba(40, 40, 40, 0.9);
    transform: scale(1.05);
}

/* =========================
   LAYOUT
========================= */
.container {
    width: 100%; max-width: 520px; display: flex; flex-direction: column;
    gap: 16px; position: relative; z-index: 2;
}

/* =========================
   PROFILE CARD
========================= */
.profile-card {
    position: relative; width: 100%; border: 1px solid rgba(0, 180, 255, 0.4);
    border-radius: 24px; background: rgba(8, 12, 20, 0.65); backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px); padding: 40px 20px 70px;
    display: flex; flex-direction: column; align-items: center;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), inset 0 0 30px rgba(0, 100, 255, 0.05);
}
.avatar {
    width: 120px; height: 120px; border-radius: 50%; object-fit: cover;
    border: 2px solid rgba(90, 60, 180, 0.8); box-shadow: 0 0 25px rgba(90, 60, 180, 0.5);
    background-color: #1a1a2e;
}
.name { 
    margin-top: 20px; font-size: 38px; font-weight: 400; letter-spacing: 4px; color: #f5f5f5; 
    font-family: Georgia, "Times New Roman", serif; /* Serif font like the image */
}

/* Bio with Typewriter Effect & 1% blur */
.bio {
    margin-top: 12px; font-size: 14px; color: #a0a5b0; letter-spacing: 0.5px;
    text-align: center; min-height: 20px; font-weight: 500;
    display: flex; align-items: center; justify-content: center; gap: 2px;
    filter: blur(1px); /* 1% blur */
}

.cursor {
    display: inline-block; width: 2px; height: 14px; background-color: #a0a5b0;
    animation: blink 1s step-end infinite; vertical-align: middle;
}
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

/* Badges */
.badges-container {
    margin-top: 24px; display: flex; align-items: center; gap: 18px;
    padding: 8px 24px; border: 1.5px solid rgba(255, 255, 255, 0.25);
    border-radius: 50px; background: rgba(0, 0, 0, 0.4);
    box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
}
.badge {
    width: 22px; height: 22px; display: flex; align-items: center;
    justify-content: center; transition: transform 0.2s;
}
.badge:hover { transform: scale(1.1); }
.badge svg { width: 100%; height: 100%; }

/* Discord Icon */
.discord-icon {
    margin-top: 30px; width: 48px; height: 48px; color: #5865F2;
    filter: drop-shadow(0 0 12px rgba(88, 101, 242, 0.6)); cursor: pointer;
    transition: transform 0.2s;
}
.discord-icon:hover { transform: scale(1.1); }
.discord-icon svg { width: 100%; height: 100%; }

/* Moon Icon */
.moon-icon {
    position: absolute; bottom: 24px; left: 24px; width: 44px; height: 44px;
    border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(0, 0, 0, 0.5); display: flex; align-items: center;
    justify-content: center; cursor: pointer; transition: background 0.2s;
}
.moon-icon:hover { background: rgba(255, 255, 255, 0.1); }
.moon-icon svg { width: 20px; height: 20px; color: #ffffff; }

/* =========================
   CARDS
========================= */
.card {
    width: 100%; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px;
    background: rgba(10, 14, 22, 0.7); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px); padding: 16px 20px;
    display: flex; align-items: center; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    transition: border-color 0.2s, background 0.2s;
}
.crypto-card { cursor: pointer; }
.crypto-card:hover { background: rgba(20, 26, 38, 0.8); border-color: rgba(255, 255, 255, 0.2); }
.crypto-icon {
    width: 44px; height: 44px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; flex-shrink: 0;
}
.crypto-icon svg { width: 28px; height: 28px; }
.crypto-name { margin-left: 16px; font-size: 18px; font-weight: 500; letter-spacing: 0.5px; }

/* Specific Crypto Colors */
.btc-bg { background: #F7931A; }
.eth-bg { background: #627EEA; }
.sol-bg { background: linear-gradient(135deg, #9945FF, #14F195); }
.ltc-bg { background: #345D9D; }

/* BTC Loading Ring */
.btc-ring {
    margin-left: auto;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0%, #00d2ff 50%, #3a7bd5 100%);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
    animation: spin 1.5s linear infinite;
    box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* User Card */
.user-avatar {
    width: 48px; height: 48px; border-radius: 50%; object-fit: cover;
    flex-shrink: 0; border: 1px solid rgba(255,255,255,0.1); background-color: #1a1a2e;
}
.user-info { margin-left: 16px; display: flex; flex-direction: column; gap: 4px; }
.user-name { font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
.online-dot {
    width: 8px; height: 8px; background-color: #23A55A; border-radius: 50%;
    box-shadow: 0 0 8px rgba(35, 165, 90, 0.6);
}
.user-handle { font-size: 13px; color: #8E9297; }

/* Music Player */
.music-cover {
    width: 48px; height: 48px; border-radius: 6px; object-fit: cover; flex-shrink: 0;
}
.music-info {
    margin-left: 16px; flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;
}
.music-title { font-size: 14px; font-weight: 600; color: #f0f0f0; }
.music-url {
    font-size: 12px; color: #8E9297; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.music-progress { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.music-time { font-size: 11px; color: #8E9297; min-width: 28px; }
.progress-bar {
    flex: 1; height: 3px; background: rgba(255, 255, 255, 0.15); border-radius: 2px; position: relative;
}
.progress-fill {
    position: absolute; left: 0; top: 0; height: 100%; width: 45%;
    background: #ffffff; border-radius: 2px;
}
.progress-thumb {
    position: absolute; right: -4px; top: 50%; transform: translateY(-50%);
    width: 8px; height: 8px; background: #ffffff; border-radius: 50%;
    box-shadow: 0 0 4px rgba(0,0,0,0.5);
}
.music-controls { display: flex; align-items: center; gap: 16px; margin-left: 16px; }
.music-controls svg { width: 18px; height: 18px; color: #ffffff; cursor: pointer; transition: opacity 0.2s; }
.music-controls svg:hover { opacity: 0.7; }

/* =========================
   TOAST NOTIFICATION
========================= */
.toast {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: rgba(15, 20, 30, 0.95); border: 1px solid rgba(0, 180, 255, 0.4);
    color: #fff; padding: 14px 28px; border-radius: 14px; font-size: 14px;
    font-weight: 500; opacity: 0;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 1000; backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 180, 255, 0.1);
    display: flex; align-items: center; gap: 10px;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast svg { width: 18px; height: 18px; color: #00d2ff; }

/* =========================

========================= */

    .sound-btn { bottom: 20px; right: 20px; width: 55px; height: 55px; font-size: 9px; }
}
</style>

<script>
// =========================
// BACKGROUND VIDEO & SOUND LOGIC
// =========================
const bgVideo = document.getElementById('bgVideo');
const soundBtn = document.getElementById('soundBtn');

// 1. Try to autoplay with sound immediately
bgVideo.muted = false;
bgVideo.volume = 1.0;

let playPromise = bgVideo.play();

if (playPromise !== undefined) {
    playPromise.then(() => {
        console.log("Autoplay with sound succeeded.");
        soundBtn.style.display = 'none';
    }).catch(error => {
        console.log("Autoplay blocked. Showing sound button.");
        bgVideo.muted = true;
        bgVideo.play().catch(e => console.log("Silent autoplay failed too:", e));
        soundBtn.style.display = 'flex';
    });
}

// 2. Handle the button click
soundBtn.addEventListener('click', () => {
    bgVideo.muted = false;
    bgVideo.volume = 1.0;
    bgVideo.play().then(() => {
        soundBtn.style.display = 'none';
    }).catch(err => {
        console.log("Manual play failed:", err);
    });
});

// 3. Fallback: Also unmute if the user clicks anywhere else on the page
document.addEventListener('click', function unmute() {
    if (bgVideo.muted) {
        bgVideo.muted = false;
        bgVideo.volume = 1.0;
        bgVideo.play().catch(e => console.log("Resume play failed:", e));
        soundBtn.style.display = 'none';
    }
}, { once: true });

// =========================
// TOAST NOTIFICATION LOGIC
// =========================
const toast = document.getElementById('toast');
let toastTimeout;

document.querySelectorAll('.crypto-card').forEach(card => {
    card.addEventListener('click', () => {
        clearTimeout(toastTimeout);
        toast.classList.add('show');
        toastTimeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 2500);
    });
});

// =========================
// TYPEWRITER EFFECT FOR BIO
// =========================
const bioText = document.getElementById('typewriter-text');
// Phrases exactly as requested
const phrases = ["lua dev", "web dev", "I love eldar", "i love nex", "i hate cold"];

let phraseIndex = 0;
let charIndex = 0;
let isDeleting = false;
let typingSpeed = 100;

function type() {
    const currentPhrase = phrases[phraseIndex];
    
    if (isDeleting) {
        bioText.textContent = currentPhrase.substring(0, charIndex - 1);
        charIndex--;
        typingSpeed = 50;
    } else {
        bioText.textContent = currentPhrase.substring(0, charIndex + 1);
        charIndex++;
        typingSpeed = 120;
    }

    if (!isDeleting && charIndex === currentPhrase.length) {
        isDeleting = true;
        typingSpeed = 2000; // Pause at the end of a phrase
    } else if (isDeleting && charIndex === 0) {
        isDeleting = false;
        phraseIndex = (phraseIndex + 1) % phrases.length;
        typingSpeed = 500; // Pause before typing the next phrase
    }

    setTimeout(type, typingSpeed);
}

// Start the typewriter effect
setTimeout(type, 500);
</script>
